services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fin_graph_api
    volumes:
      - .:/app
      - python_packages:/usr/local/lib/python3.12/site-packages
    working_dir: /app
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password123}
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:8b
    depends_on:
      - neo4j
      - qdrant
      - ollama

  neo4j:
    image: neo4j:latest
    container_name: fin_graph_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password123}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  qdrant:
    image: qdrant/qdrant:latest
    container_name: fin_graph_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: fin_graph_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  python_packages:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  ollama_data:
